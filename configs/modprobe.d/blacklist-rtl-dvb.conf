# /etc/modprobe.d/blacklist-rtl-dvb.conf
#
# The kernel's DVB-T drivers claim the RTL2832U before rtl-sdr can, which shows
# up as "usb_claim_interface error -6" from rtl_test / SDR++.
#
# Install:
#   sudo cp blacklist-rtl-dvb.conf /etc/modprobe.d/
#   sudo modprobe -r dvb_usb_rtl28xxu 2>/dev/null || true
#   sudo update-initramfs -u        # if the module is in the initramfs
#   reboot (or replug the SDR rail: aiov2_ctl SDR off && aiov2_ctl SDR on)
#
# Verify: `lsmod | grep -i rtl28` returns nothing, and `rtl_test -t` finds the device.
#
# Roll back: `sudo rm /etc/modprobe.d/blacklist-rtl-dvb.conf && sudo update-initramfs -u`,
#   then reboot. Only needed if you want the kernel DVB-T driver back.

blacklist dvb_usb_rtl28xxu
blacklist rtl2832
blacklist rtl2830
blacklist rtl2838
