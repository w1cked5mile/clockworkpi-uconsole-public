# /etc/kismet/kismet_site.conf — passive Wi-Fi survey with GPS tagging (no Bluetooth source)
#
# kismet_site.conf overrides the shipped defaults and is not overwritten by package upgrades.
#
# Scope: PASSIVE OBSERVATION ONLY. No association, no deauth, no handshake capture.
# See the responsible-use section in knowledge/README.md.
#
# Prerequisites:
#   * monitor-capable adapter (the CM4's onboard Wi-Fi, brcmfmac on wlan0, does not offer monitor
#     mode — see the Supported interface modes list below)
#   * gpsd running against the AIO GNSS  (configs/gpsd/gpsd.default)
#
# Verify the interface name and monitor support first:
#   iw dev
#   iw phy | grep -A3 'Supported interface modes'
#
# Verify after applying: start kismet, confirm the web UI at :2501 shows the source active
#   and the GPS connected.
# Roll back: `sudo rm /etc/kismet/kismet_site.conf` — Kismet reverts to its packaged defaults.

# --- Capture source -----------------------------------------------------------
# wlan1 is the AC1200 (MediaTek MT7921AUN, driver mt7921u) — arrived and installed 2026-09-30,
# monitor mode verified on-device (incl. active monitor) across 2.4/5/6 GHz. It replaced the interim
# Ralink RT5370 (rt2800usb, lsusb 148f:5370), which has been removed. Kismet puts the interface into
# monitor mode itself. Re-run `iw dev` after any replug — the MT7921's phyN index renumbers across
# re-enumeration, though wlan1 has been stable; if the RT5370 is ever refitted, the AC1200 may move
# to wlan2 and this line's interface would need updating.
source=wlan1:name=mt7921,hop_rate=5/sec

# Narrow the hop list when surveying specific channels. The MT7921 covers 2.4 GHz (US: 1-11),
# 5 GHz (36-48, 149-165, ...) and 6 GHz, so 5/6 GHz channels can now be hopped.
# source=wlan1:name=mt7921,channels="1,6,11"

# Never add an hci / linuxbluetooth source, and never enable hci0 in the web UI's Data Sources
# page (Kismet auto-detects it): Kismet's Bluetooth capture runs discovery, which scans actively
# and so transmits. Passive BLE is done without Kismet —
# knowledge/wardriving/learned/ble-passive-observation.md.

# --- GPS ----------------------------------------------------------------------
gps=gpsd:host=localhost,port=2947,reconnect=true

# --- Logging ------------------------------------------------------------------
# wiglecsv (added 2026-10-04) writes a WiGLE-format CSV next to the kismetdb, ready to upload to
# wigle.net. Kismet only writes a row once it has a GPS fix, so the GPS rail must be on and gpsd
# fixed — a no-fix run leaves a header-only file. The CSV holds precise coordinates and MACs: it
# stays under log_prefix and never goes in the repo.
log_types=kismet,wiglecsv
log_prefix=/home/user/kismet-logs
log_title=uconsole

# The shipped kismet_logging.conf sets kis_log_data_packets=true. Data frames can carry the
# payloads of unencrypted networks, which are not "readily accessible" broadcasts (Joffe v.
# Google, 729 F.3d 1262, 9th Cir. 2013) — never log them.
kis_log_data_packets=false
# Kept on (the shipped default): with data frames off, the packet log holds management frames —
# beacons and probes, which are broadcasts — and they are what beacon-interval and channel
# analysis read afterwards. Verified 2026-09-25 (first LAB-15 run, 1,400 packets): 651 management
# + 749 control frames, 0 data, 0 EAPOL, with this and dot11_keep_eapol=false. The log is gitignored and stays under log_prefix; set this to false
# for a device-list-only log.
kis_log_packets=true

# --- Behaviour ----------------------------------------------------------------
# Kismet's linux_wifi source only listens in monitor mode; nothing here makes it transmit.
# dot11_process_body was removed 2026-09-25: it does not appear in /etc/kismet/*.conf or among
# the option names in the installed kismet binary (2025.09.0), so it was silently ignored.
# Fingerprinting (for whitelisting) is not needed for a survey and stores more per-device detail.
dot11_fingerprint_devices=false
# Do not hold EAPOL (handshake) frames in memory; the shipped default is true.
# kismet_wardrive.conf sets the same.
dot11_keep_eapol=false

# --- Privacy ------------------------------------------------------------------
# Kismet logs contain MAC addresses and precise coordinates. Treat logs as sensitive:
# they are gitignored by extension only if you keep them out of the repo — do not commit
# .kismet files or anything with precise home coordinates.

# Bind the web UI to loopback only. `tailscale serve` publishes :2501 on the tailnet address, and
# that listener blocks Kismet's default 0.0.0.0:2501 bind ("could not bind socket - Address already
# in use"), so Kismet exited at startup (found 2026-09-25). Very likely the cause of the service's
# crash loop too; `systemctl start kismet` has not been re-tested since (docs/logs/known-issues.md).
# Loopback doesn't clash, tailscale serve proxies to localhost:2501, and the UI is no longer on the LAN.
httpd_bind_address=127.0.0.1
