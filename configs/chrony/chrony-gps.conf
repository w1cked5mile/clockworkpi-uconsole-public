# GPS time → system clock, via gpsd shared-memory refclocks
# ClockworkPI uConsole · CM4 · AIO V2 GNSS on /dev/serial0
#
# WHY THIS EXISTS
#   The CM4 has no battery-backed RTC, so after a power-off the clock is wrong on
#   the next boot (fake-hwclock only restores the last-seen timestamp, frozen).
#   With no network there is no NTP to correct it, and anything time-dependent
#   breaks — most visibly TOTP 2FA (codes are HMAC over a 30 s time-step; a clock
#   even minutes off is rejected), but also TLS validity and log timestamps.
#   gpsd already writes GPS time into SysV shared memory; chrony reads it and
#   disciplines the system clock. Result: correct time offline, from the sky.
#
#   systemd-timesyncd (the image default) is an SNTP *client* only — it cannot
#   consume a refclock — so chrony replaces it. Online, the `pool` line in
#   /etc/chrony/chrony.conf still applies; GPS is the offline source and, with
#   PPS and a sky-view fix, the more precise one.
#
# PAIRS WITH
#   configs/gpsd/gpsd.default   (gpsd reading /dev/serial0, option -n keeps the
#                                fix warm with no client attached — needed so SHM
#                                stays fresh for chrony)
#   software/gps.md             (fix expectations; indoors may never fix)
#
# APPLY
#   sudo apt install -y chrony
#   sudo install -m 644 configs/chrony/chrony-gps.conf /etc/chrony/conf.d/gps.conf
#   sudo systemctl disable --now systemd-timesyncd   # chrony installs usually do this already
#   sudo systemctl enable --now gpsd chrony
#   sudo systemctl restart chrony
#
# VERIFY  (GPS refclocks only become reachable with a satellite fix — see
#          software/gps.md "Fix expectations"; test outdoors / near a window)
#   chronyc sources -v      # NMEA (and PPS) listed; '#?' = seen-not-yet-locked,
#                           #   '#*' = current sync source
#   chronyc tracking        # Reference ID / Stratum reflect the live source
#   chronyc sourcestats     # per-source offset & jitter
#   timedatectl             # 'System clock synchronized: yes'
#
# ROLL BACK
#   sudo rm /etc/chrony/conf.d/gps.conf && sudo systemctl restart chrony
#   # return to the image default time daemon:
#   sudo systemctl disable --now chrony
#   sudo systemctl enable  --now systemd-timesyncd
#
# NOTE: /etc/chrony/chrony.conf already sets `makestep 1 3`, which lets chrony
# *step* (not slew) the clock on the first few updates — essential here, since a
# battery-less RTC can boot years off and slewing would take forever. Do not
# re-add makestep below; confdir is parsed after the main file and a second
# directive would silently override it.

# --- Coarse time from NMEA sentences (gpsd SHM unit 0) ----------------------
# NMEA reports the second slightly late and with OS-scheduling jitter; offset
# compensates the mean lag, delay sets the assumed max error (loose on purpose).
# This alone is accurate to a fraction of a second — far inside TOTP's 30 s step.
refclock SHM 0 refid NMEA offset 0.2 delay 0.2 precision 1e-1

# --- Pulse-per-second (gpsd SHM unit 1) -------------------------------------
# gpsd exports PPS here only when it sees a 1 Hz pulse on the receiver.
# /dev/pps0 + the pps_ldisc module were confirmed present on this build
# (2026-10-02). PPS gives the sub-microsecond edge but carries no date, so it is
# locked to NMEA for second-numbering. If PPS never updates, chrony ignores it —
# there is deliberately no `prefer`, so a silent PPS can never block sync.
refclock SHM 1 refid PPS precision 1e-7 lock NMEA
