# /etc/NetworkManager/conf.d/wifi-powersave-off.conf
# Disable Wi-Fi power save on the managed onboard radio (brcmfmac, wlan0 — Fancy's network link).
# With power save on (the driver default) a weak 2.4 GHz link to the AP turned into real packet loss:
# 20-30% ping loss and 70 ms+ latency measured 2026-09-30 at -69 to -71 dBm. Turning it off cleared
# the loss (0% / ~20 ms) without resetting the association. Scope is the managed radio only: the
# AC1200 (wlan1) is left unmanaged by wifi-onboard-only.conf, so this never touches the survey
# adapter. wifi.powersave: 2 = disable, 3 = enable, 0/default = leave to the driver (= on here).
# This is a mitigation, not a fix — the underlying weak signal still wants an antenna re-seat, a
# move closer to the AP, or Ethernet. See docs/logs/known-issues.md.
# Deploy: sudo cp configs/networkmanager/wifi-powersave-off.conf /etc/NetworkManager/conf.d/ && sudo nmcli general reload
# Verify: iw dev wlan0 get power_save  ->  "Power save: off"  (already-active wlan0 may need a reconnect to pick it up; the runtime `iw dev wlan0 set power_save off` covers the current session)
# Rollback: sudo rm /etc/NetworkManager/conf.d/wifi-powersave-off.conf && sudo nmcli general reload
[connection]
wifi.powersave = 2
