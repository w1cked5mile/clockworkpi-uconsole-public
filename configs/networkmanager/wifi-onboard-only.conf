# /etc/NetworkManager/conf.d/wifi-onboard-only.conf
# NetworkManager manages only the onboard Wi-Fi radio (brcmfmac, wlan0) — Fancy's network link.
# Every other Wi-Fi adapter (the RT5370 test dongle, the AC1200 on the USB rail) is left unmanaged:
# NetworkManager never joins networks, runs DHCP or scans (probe requests) on it, so it stays free
# for passive survey work with Kismet. Matching by driver, not interface name, covers any adapter
# whatever name it gets. `+=` appends to the list other conf.d files set (wgpia.conf); this file must sort after it, hence the name.
# Deploy: sudo cp configs/networkmanager/wifi-onboard-only.conf /etc/NetworkManager/conf.d/ && sudo nmcli general reload
# Verify: nmcli -t dev  → wlan0 connected, any USB Wi-Fi "unmanaged".
# Rollback: sudo rm /etc/NetworkManager/conf.d/wifi-onboard-only.conf && sudo nmcli general reload
#   — NetworkManager reverts to managing every Wi-Fi adapter again.
[keyfile]
unmanaged-devices+=type:wifi;except:driver:brcmfmac
