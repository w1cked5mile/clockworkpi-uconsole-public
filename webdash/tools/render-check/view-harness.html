<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Staged by render-view.sh: ./styles.css and ./js/ symlink the shipping files,
       ./fixture-status.js is generated (and clearly a FIXTURE, not live data), and the
       <header>+<main> below are copied out of index.html at render time so they can't drift.
       The skin pre-paint <script> from index.html's <head> is intentionally omitted — the shim
       sets the skin key before importing main.js instead. Opening this file un-staged won't work. -->
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!--APP-->
  <!-- Runs the REAL main.js with the network neutralized: a fake status WebSocket that delivers one
       fixture snapshot and never closes (so main.js's reconnect/onclose path stays dormant), and a
       fake fetch that serves fixtures for the boot /api/* calls. Nothing touches real hardware. -->
  <script type="module">
    import STATUS from "./fixture-status.js";
    const params = new URLSearchParams(location.search);
    const view = params.get("view") || "overview";
    const skin = params.get("skin") || "default";

    // (0) Skin: learn.js runs applySkin() at import time from this localStorage key, which would
    // clobber any data-skin attribute. Set the key BEFORE importing main.js. Default clears it.
    try {
      if (skin && skin !== "default" && skin !== "chart") localStorage.setItem("fancy.v1.skin", skin);
      else localStorage.removeItem("fancy.v1.skin");
    } catch { /* defensive */ }

    // (1) Fake WebSocket: open, deliver one fixture status, then stay open forever (no reconnect).
    class FakeWS {
      constructor() {
        this.readyState = 1;
        // setTimeout(…,0) so main.js has assigned onopen/onmessage before they fire; the timer
        // runs inside --virtual-time-budget.
        setTimeout(() => {
          this.onopen && this.onopen({});
          this.onmessage && this.onmessage({ data: JSON.stringify(STATUS) });
        }, 0);
      }
      send() {}
      close() {}            // never calls onclose → main.js never schedules a reconnect
      addEventListener() {}
    }
    window.WebSocket = FakeWS;

    // (2) Fake fetch: fixtures for the boot GETs; benign empty-ok for other /api GETs; 404 else.
    const NOW = Math.floor(Date.now() / 1000);
    const J = (o, status = 200) =>
      new Response(JSON.stringify(o), { status, headers: { "Content-Type": "application/json" } });
    const API = {
      "/api/links": { meshtastic_ui: "#", kismet: "#", openwebrx: "#" },
      "/api/mesh/messages": { messages: [
        { id: 1, ts: NOW - 300, from_id: "!a1b2c3", from_name: "Pelican", channel: 0,
          text: "Anyone on frequency?", snr: -7.5, rssi: -98, place: "near the harbour", mine: false },
        { id: 2, ts: NOW - 120, mine: true, channel: 0, text: "Fancy here, reading you.",
          tier_text: "Delivered", tier_sub: "relayed once", counter_text: "" },
      ] },
      "/api/learn/summary": { review_due: 3 },
      "/api/learn/catalog": { state: "unavailable" },   // keeps #/learn a non-blank "compile me" page
      "/api/learn/glossary": {},
      "/api/learn/progress": { items: {} },
      "/api/sdr/hunt/status": { stage: "idle", running: false, busy: null,
                                adsb_active: false, owrx_active: false, stations: [] },
      "/api/sdr/scan/status": { active: null, channels: [] },
      "/api/wpa/allowlist": { entries: [
        { bssid: "AA:BB:CC:DD:EE:FF", ssid_label: "lab-ap", basis: "owned", added_at: NOW - 86400 } ] },
      "/api/wpa/capture/status": { state: "idle", running: false },
      "/api/wpa/crack/status": { state: "idle" },
      "/api/survey/active": { active: null },
      "/api/survey/list": { surveys: [] },
      // 2 h at 30 s for the sparklines, synthetic, ending on the status fixture's values (3.97 V,
      // 3.81 W, 23 % CPU, 52.4 °C) with a slow sag and periodic +2 W episodes.
      "/api/history": { interval_s: 30, samples: Array.from({ length: 240 }, (_, i) => {
        const f = i / 239;
        return { ts: NOW - (239 - i) * 30, cpu_percent: 23 + 12 * Math.sin(i / 9) * (1 - f),
          temp_c: 48 + 4.4 * f + 0.6 * Math.sin(i / 7), voltage_v: 4.05 - 0.08 * f + 0.004 * Math.sin(i / 3),
          power_w: 3.81 + (i % 60 > 45 && i < 230 ? 2 : 0) + 0.2 * Math.sin(i), gps_sats_used: 9,
          mesh_nodes: 4 };
      }) },
    };
    window.fetch = (input) => {
      const url = typeof input === "string" ? input : input.url;
      const path = url.replace(/^https?:\/\/[^/]+/, "").split("?")[0];
      if (path in API) return Promise.resolve(J(API[path]));
      if (path.startsWith("/api/")) return Promise.resolve(J({}));          // benign for the rest
      return Promise.resolve(new Response("", { status: 404 }));            // e.g. nwr-stations.json
    };

    // (3) Route, then (4) run the REAL main.js. Hash is set before import, so main.js's one boot
    // applyRoute() reads the right route. Sub-paths (wifi/survey, sdr/adsb) pass straight through.
    location.hash = (view === "overview" || view === "") ? "#/" : "#/" + view;
    import("./js/main.js");
  </script>
</body>
</html>
